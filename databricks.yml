bundle:
  name: mlops-dashboard

include:
  - resources/*.yml

# Keep deployment source limited to this application. Patterns use the bundle
# sync exclude syntax; application source, app.yaml, and npm lockfiles remain included.
sync:
  exclude:
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - .git/**
    - .github/**
    - .pytest_cache/**
    - .mypy_cache/**
    - .ruff_cache/**
    - .tox/**
    - .venv/**
    - venv/**
    - node_modules/**
    - '**/node_modules/**'
    - dist/**
    - '**/dist/**'
    - coverage/**
    - htmlcov/**
    - '**/__pycache__/**'
    - '**/*.py[cod]'
    - '**/.pytest_cache/**'
    - '**/.mypy_cache/**'
    - '**/.ruff_cache/**'
    - '**/.vite/**'
    - '**/*.sqlite'
    - '**/*.sqlite3'
    - '**/*.db'
    - '**/*state*.json'
    - '**/*snapshot*.json'
    - backend/tests/**
    - backend/load_tests/**
    - '**/test-results/**'
    - '**/coverage/**'
    - 'MLOps research/**'
    - 'Augury repos/**'

variables:
  app_name:
    description: App name selected per deployment target.
  dashboard_secret_scope:
    description: >-
      Existing Databricks secret scope holding all of the dashboard's secrets (mlops-dashboard):
      the Mongo URL, the FST account key and, when bound, github_dispatch_token. Renamed from
      mongodb_secret_scope; the value is unchanged.
  mongodb_secret_key:
    description: Secret key in dashboard_secret_scope containing the Mongo connection string (MONGODB_URL).

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: mlops-dashboard-dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: mlops-dashboard
