command:
  - python
  - run.py
env:
  - name: MLOPS_DASHBOARD_RUNTIME
    value: databricks
  # Admin workflow actions (trigger / stop) run through GitHub Actions on
  # Databricks: the app dispatches .github/workflows/outerbounds-dispatch.yml,
  # which logs in to Outerbounds as the OIDC machine user mlops-dashboard-sp.
  # Until GITHUB_DISPATCH_TOKEN is bound below every action answers HTTP 503
  # (github_dispatch_not_configured) with setup steps.
  # BACKFILL_DISPATCH_ENABLED=1 also starts the campaign dispatcher, which on
  # Databricks refuses submissions (no idempotent Argo workflow name through
  # GitHub Actions or the Metaflow trigger API). The prod target deploys this same file.
  - name: BACKFILL_DISPATCH_ENABLED
    value: "1"
  # Read into Settings.production_mode but not consumed by any code path today
  # (inert). Keep "0"; see docs/DEPLOYMENT_RUNBOOK.md.
  - name: BACKFILL_PRODUCTION_MODE
    value: "0"
  - name: ULRPM_MACHINE_IDS_FILE
    value: data/unique_machine_ids.txt
  # Lifecycle enrichment (names, installation dates, cutoffs) from the bronze
  # Mongo mirror via the bound SQL warehouse. Auth is the app service principal
  # (injected DATABRICKS_HOST/CLIENT_ID/CLIENT_SECRET); no DATABRICKS_PROFILE here.
  - name: LIFECYCLE_SOURCE
    value: databricks
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_MACHINES_RAW_TABLE
    value: dih_prod.bronze_augury_mh_mongodb.machines_raw
  - name: LIFECYCLE_DATABRICKS_TIMEOUT_SECONDS
    value: "45"
  - name: LIFECYCLE_DATABRICKS_COLD_TIMEOUT_SECONDS
    value: "180"
  # FST blob scan fan-out. BACKFILL_BLOB_POOL_SIZE is optional (auto-sized from
  # the worker count when unset).
  - name: BACKFILL_SCAN_WORKERS
    value: "12"
  # Informational blob-vs-Databricks feature_store cross-check. Off in the app
  # until the app service principal has SELECT on both tables below; set to
  # "feature_store" to enable (fail-open: never changes scan statuses).
  - name: FEATURES_CROSSCHECK
    value: "off"
  - name: DATABRICKS_FEATURE_STORE_TABLE
    value: dih_prod.silver_mh.feature_store
  - name: DATABRICKS_FEATURE_STORE_BRONZE_TABLE
    value: dih_prod.bronze_augury_mh_blob.feature_store
  - name: FEATURES_CROSSCHECK_ROW_TOLERANCE
    value: "0.1"
  - name: FEATURES_CROSSCHECK_TIMEOUT_SECONDS
    value: "300"
  # Read-only Outerbounds connectivity probe (Admin > Outerbounds probe).
  # ON for dev per Nitai; prod shares this file. No token is configured, so
  # auth/list_runs report expected_fail. Trigger stays hard-off.
  - name: OUTERBOUNDS_PROBE_ENABLED
    value: "1"
  - name: OUTERBOUNDS_PROBE_TRIGGER_ENABLED
    value: "0"
  - name: OUTERBOUNDS_DEPLOYMENT_DOMAIN
    value: augury.obp.outerbounds.com
  - name: OUTERBOUNDS_PERIMETER
    value: default
  - name: OUTERBOUNDS_PROBE_FLOW_ALLOWLIST
    value: FSTBackfill
  # Outerbounds actions via GitHub Actions (runbook: "Outerbounds via GitHub Actions").
  - name: OUTERBOUNDS_DISPATCH_BACKEND
    value: github_actions
  - name: GITHUB_DISPATCH_REPO
    value: Nitai-Daud-Augury/MLOps-Dashboard
  - name: GITHUB_DISPATCH_REF
    value: main
  - name: GITHUB_DISPATCH_WORKFLOW
    value: outerbounds-dispatch.yml
  # GITHUB_DISPATCH_TOKEN - NOT bound yet: the secret does not exist, and an
  # unresolved valueFrom would fail the deploy. After
  #   databricks secrets put-secret mlops-dashboard github_dispatch_token -p mlops-dev
  # uncomment the github_dispatch_token resource in resources/mlops_dashboard.app.yml
  # and these lines. Deployment ids = Argo WorkflowTemplate names (the dev
  # defaults the local dashboard uses are shown):
  # - name: GITHUB_DISPATCH_TOKEN
  #   valueFrom: github_dispatch_token
  # - name: OUTERBOUNDS_FSTBACKFILL_DEPLOYMENT_ID
  #   value: fstbackfill.test.devcoreme.fstbackfill-zvsui
  # - name: OUTERBOUNDS_ULRPM_ORCHESTRATOR_DEPLOYMENT_ID
  #   value: fstbkfill.test.devfstm.ulrpmdeatorflow-hwqbr
  # - name: OUTERBOUNDS_FULLRLBL_TEST_DEPLOYMENT_ID
  #   value: fullrsttest.test.testulr.fullrlestflow-zsx6n
  # Probe: OUTERBOUNDS_PROBE_GHA_DISPATCH=1 lets Admin > Outerbounds probe dispatch
  # action=list_runs (read-only) on request. Off by default.
  # Alternative backend (OUTERBOUNDS_DISPATCH_BACKEND=metaflow): an Outerbounds
  # service-principal key as METAFLOW_SERVICE_AUTH_KEY + OBP_METAFLOW_CONFIG_URL
  # (runbook: "Outerbounds service principal"). Static machine-user keys were
  # rejected with 403, so this path is not in use.
  - name: MONGODB_URL
    valueFrom: mongodb_url
  - name: FST_PROD_ACCOUNT_NAME
    value: auguryprodfsthns
  - name: FST_PROD_CONTAINER
    value: feature-store-container
  - name: FST_PROD_ACCOUNT_KEY
    valueFrom: fst_account_key
