resources:
  apps:
    mlops_dashboard:
      name: ${var.app_name}
      description: MLOps Dashboard
      source_code_path: ..
      lifecycle:
        # bundle deploy prepares the app but does not start compute. Starting is
        # an explicit `databricks bundle run mlops_dashboard -t <target>` action.
        started: false
      resources:
        - name: mongodb_url
          secret:
            scope: ${var.mongodb_secret_scope}
            key: ${var.mongodb_secret_key}
            permission: READ
        - name: fst_account_key
          secret:
            scope: ${var.mongodb_secret_scope}
            key: fst_prod_account_key
            permission: READ
        # Serverless Starter Warehouse already attached in the mlops-dashboard-dev
        # UI; keep the Bundle resource so deploys stay consistent.
        - name: sql-warehouse
          sql_warehouse:
            id: "6ed9ddd0b2661edc"
            permission: CAN_USE
        # GitHub Actions dispatch token for Outerbounds actions (fine-grained PAT,
        # Actions read/write + Contents read on Nitai-Daud-Augury/MLOps-Dashboard),
        # exposed to the app as GITHUB_DISPATCH_TOKEN (app.yaml). The key must exist in
        # the scope of every target's workspace, or the deploy fails.
        - name: github_dispatch_token
          secret:
            scope: ${var.mongodb_secret_scope}
            key: github_dispatch_token
            permission: READ
        # Backfill manifest + control-store credential: a container-scoped SAS
        # (permissions rcwl, HTTPS only, with an expiry) for aifleetmlopsfstbackfill/fst-backfill,
        # exposed as FST_BACKFILL_SAS_TOKEN (app.yaml). This is a different account from the
        # FST read store above. Create the key BEFORE deploying, or the deploy fails.
        - name: fst_backfill_manifest_sas
          secret:
            scope: ${var.mongodb_secret_scope}
            key: fst_backfill_manifest_sas
            permission: READ
